name: R003 automation checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  r003-automation-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run R003 automation checks
        run: |
          python tool/run_r003_automation_checks.py --base-ref origin/main

name: Decision app native demo builds

on:
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/decision_app/**'
      - '.github/workflows/decision-app-demo-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cd android
          gradle --no-daemon :app:assembleDebug
        working-directory: prototypes/decision_app
      - uses: actions/upload-artifact@v4
        with:
          name: DecisionApp-Android-demo
          path: prototypes/decision_app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: |
          cp ../index.html DecisionApp/index.html
          xcodegen generate
          xcodebuild -project DecisionApp.xcodeproj -scheme DecisionApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project DecisionApp.xcodeproj -scheme DecisionApp -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/DecisionApp.app DecisionApp-simulator.zip
          ditto -c -k --keepParent build/Build/Products/Release-iphoneos/DecisionApp.app DecisionApp-device-unsigned.zip
        working-directory: prototypes/decision_app/ios
      - uses: actions/upload-artifact@v4
        with:
          name: DecisionApp-iOS-unsigned
          path: prototypes/decision_app/ios/DecisionApp-*.zip
          if-no-files-found: error
